<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no" />
    <link rel="shortcut icon" href="images/favicon.ico" />
    <link rel="stylesheet" href="css/style.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Commissioner&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: "Commissioner", sans-serif;
        padding: 5rem;
      }
    </style>
    <title>Home Page</title>
    <script src="js/bundle.min.js"></script>
  </head>
  <body>
    <input
      class="ranger-input"
      type="range"
      name="percents"
      min="-1"
      max="1"
      step="0.01"
      value="-0.5"
      data-max-value="0.8"
    /><br /><br /><input
      class="ranger-input"
      type="range"
      name="ages"
      value="2000"
      min="0"
      max="50000"
      step="1"
      data-max-value="35000"
    />
    <div class="form_control">
      <span class="form_control_container"
        ><label class="form_control_container__time">Min</label>
        <input
          class="form_control_container__time__input"
          type="number"
          id="fromInput"
          value="10"
          min="0"
          max="100"
        /> </span
      ><span class="form_control_container"
        ><label class="form_control_container__time">Max</label>
        <input class="form_control_container__time__input" type="number" id="toInput" value="35000" min="0" max="50000"
      /></span>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll(".ranger-input").forEach((slide) => new SliderController(slide));
      });
    </script>
  </body>
</html>
